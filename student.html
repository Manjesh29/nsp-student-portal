<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Portal | NSP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #07366d;
    }

    header {
      background: #07366d;
      color: white;
      text-align: center;
      padding: 25px 15px;
      border-bottom: 5px solid #f5ad00;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .card h2 {
      margin-top: 0;
    }

    .row {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .label {
      font-weight: bold;
    }

    #status {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .fee-item {
      background: #f8fafc;
      border: 1px solid #e0e6ed;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }

    .fee-item p {
      margin: 8px 0;
    }

    .paid {
      color: green;
      font-weight: bold;
    }

    .unpaid {
      color: #c62828;
      font-weight: bold;
    }

    #feeMessage {
      text-align: center;
      color: #666;
      padding: 15px;
    }

    .back-button,
    #logoutButton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #logoutButton {
      background: #f5ad00;
      color: #07366d;
    }

    .back-button {
      display: block;
      background: #07366d;
      color: white;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 NSP Student Portal</h1>
  <p>Navodaya Success Point</p>
</header>


<div class="container">

  <div id="status">
    Loading student details...
  </div>


  <!-- =========================
       STUDENT PROFILE
       ========================= -->

  <div
    class="card"
    id="profileCard"
    style="display:none;"
  >

    <h2>👤 Student Profile</h2>

    <div class="row">
      <span class="label">Student ID:</span>
      <span id="studentId">-</span>
    </div>

    <div class="row">
      <span class="label">Name:</span>
      <span id="studentName">-</span>
    </div>

    <div class="row">
      <span class="label">Class:</span>
      <span id="studentClass">-</span>
    </div>

    <div class="row">
      <span class="label">School:</span>
      <span id="schoolName">-</span>
    </div>

    <div class="row">
      <span class="label">District:</span>
      <span id="district">-</span>
    </div>

    <div class="row">
      <span class="label">State:</span>
      <span id="state">-</span>
    </div>

    <div class="row">
      <span class="label">Status:</span>
      <span id="studentStatus">-</span>
    </div>

  </div>


  <!-- =========================
       FEES
       ========================= -->

  <div
    class="card"
    id="feesCard"
    style="display:none;"
  >

    <h2>💰 My Fees</h2>

    <div id="feeMessage">
      Loading fee details...
    </div>

    <div id="feesList"></div>

  </div>


  <a
    href="index.html"
    class="back-button"
    id="backButton"
    style="display:none;"
  >
    ← Back to Dashboard
  </a>


  <button
    id="logoutButton"
    style="display:none;"
  >
    Logout
  </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://eifjroamwsroaxrlupym.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_grY-Dece7_RS5CLwzAZZ_A_icnSUMIj";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );



/* ==================================
   LOAD LOGGED-IN STUDENT
   ================================== */

async function loadStudent() {

  const status =
    document.getElementById("status");

  const profileCard =
    document.getElementById("profileCard");

  const feesCard =
    document.getElementById("feesCard");

  const logoutButton =
    document.getElementById("logoutButton");

  const backButton =
    document.getElementById("backButton");


  try {

    /* GET LOGGED IN USER */

    const {
      data: { user },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError || !user) {

      status.innerText =
        "Your login session was not found. Please login again.";

      setTimeout(function() {
        window.location.href = "login.html";
      }, 1500);

      return;
    }



    /* GET STUDENT DATABASE ROW */

    const {
      data: student,
      error: studentError
    } =
      await supabaseClient
        .from("students")
        .select("*")
        .eq("auth_user_id", user.id)
        .single();


    if (studentError) {

      console.error(studentError);

      status.innerText =
        "Student data error: " +
        studentError.message;

      return;
    }


    if (!student) {

      status.innerText =
        "Student record not found.";

      return;
    }



    /* ==========================
       FILL PROFILE DATA
       ========================== */

    document.getElementById("studentId").innerText =
      student.nsp_id || "-";

    document.getElementById("studentName").innerText =
      student.student_name || "-";

    document.getElementById("studentClass").innerText =
      student.class || "-";

    document.getElementById("schoolName").innerText =
      student.school_name || "-";

    document.getElementById("district").innerText =
      student.district || "-";

    document.getElementById("state").innerText =
      student.state || "-";

    document.getElementById("studentStatus").innerText =
      student.student_status || "-";



    /* REMOVE LOADING */

    status.style.display = "none";

    
    backButton.style.display = "block";



    /* ==================================
       CHECK WHICH DASHBOARD CARD
       WAS CLICKED
       ================================== */

    const pageSection =
      window.location.hash;


    /* MONTHLY FEES CLICKED */

    if (pageSection === "#feesCard") {

      profileCard.style.display = "none";

      feesCard.style.display = "block";

      await loadFees(student.id);

      return;
    }



    /* MY PROFILE CLICKED */

    if (pageSection === "#profileCard") {

  profileCard.style.display = "block";
  feesCard.style.display = "none";
  logoutButton.style.display = "block";

  return;
    }



    /* DIRECT student.html OPENED */

    profileCard.style.display = "block";

    feesCard.style.display = "none";

  }

  catch (error) {

    console.error(error);

    status.innerText =
      "Something went wrong: " +
      error.message;

  }

}



/* ==================================
   LOAD STUDENT FEES
   ================================== */

async function loadFees(studentDatabaseId) {

  const feeMessage =
    document.getElementById("feeMessage");

  const feesList =
    document.getElementById("feesList");


  feeMessage.style.display = "block";
  feeMessage.style.color = "#666";
  feeMessage.innerText =
    "Loading fee details...";

  feesList.innerHTML = "";


  const {
    data: fees,
    error
  } =
    await supabaseClient
      .from("fees")
      .select("*")
      .eq(
        "student_id",
        studentDatabaseId
      )
      .order(
        "fee_year",
        { ascending: false }
      )
      .order(
        "fee_month",
        { ascending: false }
      );


  if (error) {

    console.error(error);

    feeMessage.style.color =
      "#c62828";

    feeMessage.innerText =
      "Unable to load fees: " +
      error.message;

    return;
  }



  if (!fees || fees.length === 0) {

    feeMessage.innerText =
      "No fee records found.";

    return;
  }



  feeMessage.style.display =
    "none";


  fees.forEach(function(fee) {

    const item =
      document.createElement("div");

    item.className =
      "fee-item";


    const amount =
      Number(fee.amount || 0);

    const amountPaid =
      Number(fee.amount_paid || 0);

    const balance =
      amount - amountPaid;


    const feeStatus =
      String(
        fee.status || "UNPAID"
      ).toUpperCase();


    const statusClass =
      feeStatus === "PAID"
        ? "paid"
        : "unpaid";



    item.innerHTML = `

      <p>
        <strong>Month:</strong>
        ${fee.fee_month || "-"} /
        ${fee.fee_year || "-"}
      </p>

      <p>
        <strong>Total Fee:</strong>
        ₹${amount.toLocaleString("en-IN")}
      </p>

      <p>
        <strong>Amount Paid:</strong>
        ₹${amountPaid.toLocaleString("en-IN")}
      </p>

      <p>
        <strong>Balance:</strong>
        ₹${balance.toLocaleString("en-IN")}
      </p>

      <p>
        <strong>Status:</strong>

        <span class="${statusClass}">
          ${feeStatus}
        </span>
      </p>

      <p>
        <strong>Payment Date:</strong>
        ${fee.payment_date || "-"}
      </p>

      <p>
        <strong>Receipt:</strong>
        ${fee.receipt_number || "-"}
      </p>

      <p>
        <strong>Payment Mode:</strong>
        ${fee.payment_mode || "-"}
      </p>

      ${
        fee.remarks
        ?
        `
        <p>
          <strong>Remarks:</strong>
          ${fee.remarks}
        </p>
        `
        :
        ""
      }

    `;


    feesList.appendChild(item);

  });

}



/* ==================================
   LOGOUT
   ================================== */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

    }
  );



/* START PAGE */

loadStudent();

</script>

</body>
</html>
