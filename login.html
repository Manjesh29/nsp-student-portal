<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | NSP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      min-height: 100vh;
    }

    .header {
      background: #07366d;
      color: white;
      text-align: center;
      padding: 35px 15px;
      border-bottom: 5px solid #f5ad00;
    }

    .header .icon {
      font-size: 55px;
    }

    .header h1 {
      margin-top: 8px;
      font-size: 28px;
    }

    .header p {
      margin-top: 8px;
      color: #f5ad00;
      font-size: 17px;
    }

    .login-container {
      max-width: 430px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .login-card {
      background: white;
      border-radius: 22px;
      padding: 32px 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .login-card h2 {
      color: #07366d;
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      color: #07366d;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 22px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #07366d;
      box-shadow: 0 0 0 2px rgba(7,54,109,0.10);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #f5ad00;
      color: #072f5f;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      min-height: 22px;
    }

    .help {
      margin-top: 25px;
      background: #eef4fb;
      padding: 15px;
      border-radius: 12px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #07366d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="icon">🎓</div>
    <h1>NSP Student Portal</h1>
    <p>Navodaya Success Point</p>
  </header>

  <main class="login-container">

    <div class="login-card">

      <h2>🔐 Student Login</h2>

      <p class="subtitle">
        Login using your NSP Student ID and password.
      </p>

      <form id="loginForm">

        <label for="studentId">Email Address</label>
        <input
  type="email"
  id="studentId"
  placeholder="Enter your email"
  autocomplete="email"
  required
>

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">
          Login to Portal
        </button>

      </form>

      <div id="message"></div>

      <div class="help">
        🔒 Your Student ID and password are provided by
        <strong>Navodaya Success Point</strong>.
        Never share your password with anyone.
      </div>

      <a class="back" href="index.html">
        ← Back to Home
      </a>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://eifjroamwsroaxrlupyn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_grY-Dece7_RS5CLwzAZZ_A_icnSUMIj";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

loginForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document
    .getElementById("studentId")
    .value.trim();

  const password = document
    .getElementById("password")
    .value;

  if (!email || !password) {
    message.style.color = "#c62828";
    message.textContent = "Please enter email and password.";
    return;
  }

  loginButton.disabled = true;
  message.style.color = "#07366d";
  message.textContent = "Checking login...";

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      throw error;
    }

    if (!data || !data.session) {
      throw new Error("Login successful but session was not created.");
    }

    message.style.color = "green";
    message.textContent = "Login successful! Opening dashboard...";

    window.location.href = "./student.html";

  } catch (error) {
    console.error(error);

    message.style.color = "#c62828";
    message.textContent =
      error.message || "Invalid email or password.";

    loginButton.disabled = false;
  }
});
</script>
   

</body>
</html>
